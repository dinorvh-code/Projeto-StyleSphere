<div class="container">

<h1 class="titulo">Vestiário Masculino</h1>

<div class="opcoes-principais">

    @for (item of elementos; track item.imagem){

        <div class="peça">
            <p class="nome">{{item.nome}}</p>
            <img [src]="item.imagem" [alt]="item.imagem" class="img">
            <div class="precos">
                <p class="$posterior">{{item.$posterior}}</p>
            </div>
            <div class="tamanhos">
                <button class="btn-pp">PP</button>
                <button class="btn-p">P</button>
                <button class="btn-m">M</button>
                <button class="btn-g">G</button>
                <button class="btn-gg">GG</button>
            </div>
            <button class="adicionar">Adicionar</button>
        </div>

    }

</div>

</div>
